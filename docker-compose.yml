services:
  backend-tracker-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db-service:27017/devdb
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - db-service

  db-service:
    image: mongo:7.0
    ports:
      - "27017:27017"

  frontend-tracker:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
